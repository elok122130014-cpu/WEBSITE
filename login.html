<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENTALUX | Login</title>

<link rel="stylesheet" href="css/auth.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="auth-container">

<img src="img/logo.png" class="logo" alt="Logo">

<h2>Selamat Datang</h2>

<p>

Masuk ke sistem monitoring VENTALUX untuk melihat data turbin secara realtime.

</p>

<form id="loginForm">

<div class="input-group">

<label>

<i class="fa-solid fa-envelope"></i>

Email

</label>

<<input
    type="email"
    id="email"
    placeholder="Masukkan email"
    required>

</div>

<div class="input-group">

<label>

<i class="fa-solid fa-lock"></i>

Password

</label>

<input
    type="password"
    id="password"
    placeholder="Masukkan password"
    required>

</div>

<div class="option">

<label>

<input type="checkbox">

Ingat Saya

</label>

<a href="#">

Lupa Password?

</a>

</div>
<p
    id="loginMessage"
    style="
        margin: 10px 0;
        text-align: center;
        font-size: 14px;
        font-weight: 500;
    ">
</p>

<button
type="submit"
class="auth-btn">

Masuk

</button>

</form>

<div class="bottom-text">

Belum memiliki akun?

<a href="register.html">

Daftar Sekarang

</a>

</div>

</div>

<script
    type="module"
    src="js/login.js">
</script>

</body>

</html>
